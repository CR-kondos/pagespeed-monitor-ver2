name: Daily Monitor

on:
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node script.js
