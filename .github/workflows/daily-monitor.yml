name: Daily Monitor

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Lighthouse Desktop
        run: |
          npx lighthouse https://www.ocn.ne.jp \
            --preset=desktop \
            --output=json \
            --output-path=desktop-report.json \
            --chrome-flags="--headless"

      - name: Inspect Report
        run: |
          cat desktop-report.json | grep -A 20 '"largest-contentful-paint"'
