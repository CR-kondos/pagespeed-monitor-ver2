name: Daily Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '30 8 * * 1-5'

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Lighthouse Mobile
        run: |
          npx lighthouse https://www.ocn.ne.jp \
            --output=json \
            --output-path=mobile-report.json \
            --chrome-flags="--headless"

      - name: Run Lighthouse Desktop
        run: |
          npx lighthouse https://www.ocn.ne.jp \
            --preset=desktop \
            --output=json \
            --output-path=desktop-report.json \
            --chrome-flags="--headless"

      - name: Show Mobile Config
        run: |
          grep -A 60 '"configSettings"' mobile-report.json

      - name: Show Mobile Metrics
        run: |
          grep -E '"largest-contentful-paint"|"total-blocking-time"|"cumulative-layout-shift"' mobile-report.json -A 12

      - name: Show Desktop Metrics
        run: |
          grep -E '"largest-contentful-paint"|"total-blocking-time"|"cumulative-layout-shift"' desktop-report.json -A 12

      - name: Build CSV
        run: |
          node parser.js

      - name: Show CSV
        run: |
          cat metrics.csv
