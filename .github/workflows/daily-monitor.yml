name: Daily Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '30 8 * * 1-5'

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run Lighthouse Mobile
        run: |
          npx lighthouse https://www.ocn.ne.jp \
            --output=json \
            --output-path=mobile-report.json \
            --chrome-flags="--headless"

      - name: Run Lighthouse Desktop
        run: |
          npx lighthouse https://www.ocn.ne.jp \
            --preset=desktop \
            --output=json \
            --output-path=desktop-report.json \
            --chrome-flags="--headless"

      - name: Show Mobile Config
        run: |
          grep -A 60 '"configSettings"' mobile-report.json

      - name: Show Mobile LCP
        run: |
          grep -A 15 '"largest-contentful-paint"' mobile-report.json

      - name: Show Desktop LCP
        run: |
          grep -A 15 '"largest-contentful-paint"' desktop-report.json
